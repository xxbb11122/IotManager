<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f78">
  <meta name="description" content="企业现场设备运营客户端">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>设备运营</title>
  <style>
    html, body { min-height: 100%; margin: 0; background: #f3f6f7; }
    #startup-overlay {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: #f3f6f7; opacity: 1; transition: opacity 150ms ease-out;
    }
    #startup-overlay.startup-overlay--leaving { opacity: 0; pointer-events: none; }
    .startup-visual { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
    .startup-icon {
      position: relative; z-index: 1; width: 110px; height: 110px; object-fit: contain;
      filter: drop-shadow(0 7px 9px rgba(31, 67, 78, .12));
      animation: startup-icon-breathe 420ms cubic-bezier(.2, 0, 0, 1) both;
    }
    .startup-halo {
      position: absolute; width: 136px; height: 136px; border-radius: 50%;
      background: radial-gradient(circle, rgba(90, 171, 227, .26), rgba(90, 171, 227, .13) 47%, rgba(90, 171, 227, 0) 75%);
      animation: startup-halo-fade 420ms cubic-bezier(.2, 0, 0, 1) both;
    }
    #startup-overlay.startup-overlay--leaving .startup-icon,
    #startup-overlay.startup-overlay--leaving .startup-halo { animation-play-state: paused; }
    .startup-status { position: absolute; top: calc(50% + 100px); margin: 0; color: #607078; font: 13px/1.5 system-ui, sans-serif; text-align: center; }
    .startup-retry {
      position: absolute; top: calc(50% + 142px); padding: 10px 16px; border: 1px solid #bdcdd1;
      border-radius: 8px; background: #fff; color: #14555d; font: 600 14px/1.3 system-ui, sans-serif;
    }
    [hidden] { display: none !important; }
    @keyframes startup-icon-breathe { 0% { transform: scale(1); } 43% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes startup-halo-fade { 0% { opacity: 0; transform: scale(.85); } 43% { opacity: 1; transform: scale(1.55); } 100% { opacity: 0; transform: scale(1.85); } }
    @media (prefers-reduced-motion: reduce) {
      #startup-overlay, .startup-icon, .startup-halo { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app"><p role="status">正在准备设备运营界面…</p></div>
  <div id="startup-overlay" aria-label="正在打开设备运营" role="status">
    <div class="startup-visual" aria-hidden="true">
      <div class="startup-halo"></div>
      <img class="startup-icon" src="/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" alt="">
    </div>
    <p id="startup-status" class="startup-status" hidden>正在准备设备运营界面…</p>
    <button id="startup-retry" class="startup-retry" type="button" hidden>重新加载</button>
  </div>
  <noscript><style>#startup-overlay { display: none !important; }</style>设备运营需要启用 JavaScript。未发送任何设备操作，请启用后重新打开。</noscript>
  <script>
    (() => {
      const overlay = document.getElementById('startup-overlay');
      const app = document.getElementById('app');
      const status = document.getElementById('startup-status');
      const retry = document.getElementById('startup-retry');
      app.inert = true;
      app.setAttribute('aria-hidden', 'true');
      const waiting = setTimeout(() => { status.hidden = false; }, 420);
      const failed = setTimeout(() => {
        status.textContent = '界面启动未完成，请重新加载。';
        status.hidden = false;
        retry.hidden = false;
      }, 4000);
      retry.addEventListener('click', () => location.reload());
      window.__iotStartupWatchdog = {
        stop() { clearTimeout(waiting); clearTimeout(failed); }
      };
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
