<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Apple & Muse 极致晶体毛玻璃物联系统 (独立视检版)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 0;
    }

    /* ── 背景 Muse / Apple 弥散折射光环层 ── */
    /* 这是产生真实晶体折射的核心：毛玻璃必须有背部环境光才能呈现高折射率景深 */
    .ambient-glow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .glow-orb-1 {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 122, 255, 0.40) 0%, rgba(0, 122, 255, 0) 70%);
      top: -80px;
      left: 15%;
      filter: blur(60px);
    }
    .glow-orb-2 {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(175, 82, 222, 0.35) 0%, rgba(255, 45, 85, 0) 70%);
      bottom: 80px;
      right: 10%;
      filter: blur(70px);
    }
    .glow-orb-3 {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(48, 176, 199, 0.30) 0%, rgba(52, 199, 89, 0) 70%);
      top: 40%;
      left: 25%;
      filter: blur(65px);
    }

    /* 顶层工程视检工具条 */
    .inspection-toolbar {
      width: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      z-index: 1000;
    }

    .inspection-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inspection-badge {
      background: #007aff;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 11px;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.4);
    }

    .inspection-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inspection-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .inspection-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .inspection-btn.active {
      background: #007aff;
      border-color: #007aff;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.4);
    }

    /* 主机模拟外壳：支持真机尺寸切换与全屏铺满 */
    #mobile-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px; /* 默认手机视口，可通过工具条切换宽屏 */
      min-height: calc(100vh - 42px);
      height: calc(100vh - 42px);
      background: rgba(242, 245, 248, 0.78);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 1.5px rgba(255, 255, 255, 0.8);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: max-width 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    #view-root {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 84px; /* 为悬浮底栏预留安全避让区 */
      -webkit-overflow-scrolling: touch;
    }

    /* 当切换到 AI Tab 时，消除父级滚动，交由 AI 专有流控制器 */
    #view-root.ai-tab-active {
      padding: 0;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 浮动提示通知卡片 */
    .toast-banner {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 9999;
      pointer-events: none;
    }
    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- 背景弥散高斯光环（提供 Muse / Apple visionOS 级别的物理折射背光） -->
  <div class="ambient-glow-layer">
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <div class="glow-orb-3"></div>
  </div>

  <!-- 视检调试工具栏 -->
  <aside class="inspection-toolbar">
    <div class="inspection-title-group">
      <span class="inspection-badge">Apple 质感单行看板</span>
      <strong>IoT Manager 工业移动端视检</strong>
    </div>
    <div class="inspection-controls">
      <button id="btn-theme-auto" class="inspection-btn active" type="button">晶体轻玻璃 (Auto)</button>
      <button id="btn-theme-solid" class="inspection-btn" type="button">实色降级 (Solid F11)</button>
      <button id="btn-width-phone" class="inspection-btn active" type="button">单设备单行 (440px)</button>
      <button id="btn-width-tablet" class="inspection-btn" type="button">宽屏视图 (680px F15)</button>
    </div>
  </aside>

  <div id="toast" class="toast-banner">操作成功</div>

  <!-- 移动端视口容器 -->
  <main id="mobile-viewport">
    <!-- 1. 全机型自适应通用轻毛玻璃顶栏挂载点 -->
    <header id="header-mount"></header>

    <!-- 2. 主页面内容动态挂载点 -->
    <section id="view-root"></section>

    <!-- 3. 悬浮轻毛玻璃底栏挂载点 -->
    <nav id="nav-mount"></nav>
  </main>

  <!-- 运行 apple-glass-standalone.js 单文件组件库 -->
  <script type="module">
    import {
      injectAppleGlassStyles,
      createUniversalHeader,
      createHomeKitTile,
      createDeviceListContainer,
      createNativeFluidSlider,
      createQuickControlSheet,
      createDeviceDetailView,
      createBottomNav,
      createAiMessageList,
      createCrystalAiComposer,
      createBleScannerView,
      createActivityStreamView
    } from './apple-glass-standalone.js';

    // 1. 注入自包含全套苹果晶体 CSS
    injectAppleGlassStyles();

    // 视检工具栏交互
    const viewport = document.getElementById('mobile-viewport');
    const btnAuto = document.getElementById('btn-theme-auto');
    const btnSolid = document.getElementById('btn-theme-solid');
    const btnPhone = document.getElementById('btn-width-phone');
    const btnTablet = document.getElementById('btn-width-tablet');

    btnAuto.onclick = () => {
      document.body.classList.remove('glass-theme-solid');
      btnAuto.classList.add('active');
      btnSolid.classList.remove('active');
      showToast('已切换至：Apple / Muse 晶体质感轻毛玻璃');
    };
    btnSolid.onclick = () => {
      document.body.classList.add('glass-theme-solid');
      btnSolid.classList.add('active');
      btnAuto.classList.remove('active');
      showToast('已开启：实色模式 (Solid Mode F11 降级)');
    };

    btnPhone.onclick = () => {
      viewport.style.maxWidth = '440px';
      btnPhone.classList.add('active');
      btnTablet.classList.remove('active');
      showToast('视口宽度设为 440px (单行单设备)');
    };
    btnTablet.onclick = () => {
      viewport.style.maxWidth = '680px';
      btnTablet.classList.add('active');
      btnPhone.classList.remove('active');
      showToast('视口宽度设为 680px (宽屏单行自适应)');
    };

    // 辅助 Toast 提示 (纯 textContent，杜绝 XSS)
    const toast = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = String(msg);
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 2. 挂载通用自适应顶栏
    const headerMount = document.getElementById('header-mount');
    const headerNode = createUniversalHeader({
      siteName: 'Site A - 智能物联实验馆',
      siteCode: 'SITE-ALPHA',
      linkStatus: 'BLE 12ms',
      weatherSummary: '室外 24.5°C · 湿度 52% (参考)',
      onlineCount: 4,
      totalCount: 6,
      onSiteClick: () => showToast('站点切换：当前已在 SITE-ALPHA 实验园区'),
      onScanClick: () => {
        showToast('进入近场设备扫描');
        switchTab('settings');
      }
    });
    headerMount.appendChild(headerNode);

    // 3. 挂载悬浮轻毛玻璃底栏
    const navMount = document.getElementById('nav-mount');
    const bottomNavNode = createBottomNav({
      activeTab: 'devices',
      onTabChange: (newTab) => switchTab(newTab)
    });
    navMount.appendChild(bottomNavNode);

    // 4. 符合技术框架与契约的设备数据源 (大小适中、信息均衡)
    const demoDevices = [
      {
        id: 'dev-101',
        name: '恒温恒湿空调',
        type: 'HVAC',
        siteCode: 'SITE-ALPHA',
        icon: '❄️',
        status: 'ONLINE',
        reportedState: { power: true, level: 23, temperature: 23.5, humidity: 48 },
        desiredState: { power: true, level: 23 },
        commandStatus: 'ACKNOWLEDGED',
        capabilities: [{ controlType: 'switch', writable: true }, { controlType: 'range', min: 16, max: 30, step: 0.5, writable: true }]
      },
      {
        id: 'dev-102',
        name: '调光筒灯',
        type: 'LIGHT',
        siteCode: 'SITE-ALPHA',
        icon: '💡',
        status: 'ONLINE',
        reportedState: { power: true, level: 75 },
        desiredState: { power: true, level: 75 },
        commandStatus: 'ACKNOWLEDGED',
        capabilities: [{ controlType: 'switch', writable: true }, { controlType: 'range', min: 0, max: 100, step: 1, writable: true }]
      },
      {
        id: 'dev-103',
        name: '正压新风机',
        type: 'VENTILATION',
        siteCode: 'SITE-ALPHA',
        icon: '🌀',
        status: 'ONLINE',
        reportedState: { power: true, level: 3 },
        desiredState: { power: true, level: 3 },
        commandStatus: 'ACKNOWLEDGED',
        capabilities: [{ controlType: 'switch', writable: true }]
      },
      {
        id: 'dev-104',
        name: '循环水冷泵',
        type: 'PUMP',
        siteCode: 'SITE-ALPHA',
        icon: '💧',
        status: 'ONLINE',
        reportedState: { power: true, level: 60, pressure: 0.45 },
        desiredState: { power: true, level: 70 },
        commandStatus: 'PENDING', // 演示 F03 待确认状态
        capabilities: [{ controlType: 'switch', writable: true }, { controlType: 'range', min: 0, max: 100, step: 5, writable: true }]
      },
      {
        id: 'dev-105',
        name: '综合环境仪',
        type: 'SENSOR',
        siteCode: 'SITE-ALPHA',
        icon: '🌡️',
        status: 'ONLINE',
        reportedState: { temperature: 24.2, humidity: 50, tvoc: 0.04 },
        desiredState: {},
        commandStatus: 'ACKNOWLEDGED',
        capabilities: [] // 监测仪表，无开闭控制
      },
      {
        id: 'dev-106',
        name: '应急发电机',
        type: 'POWER',
        siteCode: 'SITE-ALPHA',
        icon: '⚡',
        status: 'OFFLINE',
        reportedState: { power: false, level: 0 },
        desiredState: { power: false, level: 0 },
        commandStatus: 'ACKNOWLEDGED',
        capabilities: [{ controlType: 'switch', writable: true }]
      }
    ];

    let currentTab = 'devices';
    let searchQuery = '';
    let activeFilter = 'ALL';

    // AI 会话与草稿持久状态 (满足 F04: 导航切换不丢失)
    let aiDraftText = '';
    let aiIsBusy = false;
    const aiMessages = [
      {
        role: 'ASSISTANT',
        content: '您好！我是 Apple Intelligence 物联运维智能体。当前园区已连接 4 台受控设备，管网压力与温湿度保持在最优能效工况。'
      }
    ];

    function switchTab(tabId) {
      currentTab = tabId;
      renderTabContent(tabId);
    }

    const viewRoot = document.getElementById('view-root');

    function renderTabContent(tabId) {
      viewRoot.replaceChildren();

      if (tabId === 'ai') {
        viewRoot.classList.add('ai-tab-active');
      } else {
        viewRoot.classList.remove('ai-tab-active');
      }

      if (tabId === 'devices') {
        renderDevicesView();
      } else if (tabId === 'ai') {
        renderAiView();
      } else if (tabId === 'activity') {
        renderActivityView();
      } else if (tabId === 'settings') {
        renderSettingsView();
      }
    }

    // ── Tab 1: 均衡美观双列看板与快控抽屉 ──
    function renderDevicesView() {
      viewRoot.replaceChildren();

      const filtered = demoDevices.filter(dev => {
        const matchesSearch = !searchQuery || dev.name.toLowerCase().includes(searchQuery.toLowerCase());
        let matchesFilter = true;
        if (activeFilter === 'ONLINE' || activeFilter === '在线运行') {
          matchesFilter = dev.status === 'ONLINE';
        } else if (activeFilter === 'OFFLINE' || activeFilter === '离线/停机') {
          matchesFilter = dev.status === 'OFFLINE';
        } else if (activeFilter === 'PENDING' || activeFilter === '待回执') {
          matchesFilter = dev.commandStatus === 'PENDING' || dev.commandStatus === 'SENT';
        }
        return matchesSearch && matchesFilter;
      });

      const listContainer = createDeviceListContainer({
        devices: filtered,
        activeFilter,
        searchQuery,
        onSearch: (val) => {
          searchQuery = val;
          renderDevicesView();
        },
        onFilterChange: (f) => {
          activeFilter = f;
          renderDevicesView();
        },
        onDeviceToggle: (id, targetPower) => {
          const dev = demoDevices.find(d => d.id === id);
          if (dev) {
            dev.desiredState.power = targetPower;
            dev.commandStatus = 'PENDING';
            showToast(`${dev.name} 开关下发中 (PENDING)`);
            renderDevicesView();

            // 模拟 800ms 后收到硬件回执 (ACK)
            setTimeout(() => {
              dev.reportedState.power = targetPower;
              dev.commandStatus = 'ACKNOWLEDGED';
              showToast(`${dev.name} 硬件回执已确认 (ACK)`);
              renderDevicesView();
            }, 800);
          }
        },
        onDeviceClick: (id) => {
          const dev = demoDevices.find(d => d.id === id);
          if (!dev) return;
          if (dev.capabilities?.some(c => c.controlType === 'range')) {
            openQuickControlSheet(dev);
          } else {
            openDeviceDetail(dev);
          }
        }
      });

      viewRoot.appendChild(listContainer);
    }

    // 打开控制抽屉
    function openQuickControlSheet(dev) {
      const sheet = createQuickControlSheet({
        device: dev,
        onCommitValue: (id, val) => {
          dev.desiredState.level = val;
          dev.commandStatus = 'PENDING';
          showToast(`${dev.name} 目标强度已下发: ${val}% (等待确认)`);
          renderDevicesView();

          setTimeout(() => {
            dev.reportedState.level = val;
            dev.commandStatus = 'ACKNOWLEDGED';
            showToast(`${dev.name} 事实状态已同步: ${val}%`);
            renderDevicesView();
          }, 800);
        }
      });
      document.body.appendChild(sheet);
    }

    // 打开设备详情页
    function openDeviceDetail(dev) {
      viewRoot.replaceChildren();
      const detailView = createDeviceDetailView({
        device: dev,
        onBack: () => renderDevicesView(),
        onCommitControl: (id, val) => {
          dev.desiredState.level = val;
          showToast(`参数微调下发: ${val}`);
        }
      });
      viewRoot.appendChild(detailView);
    }

    // ── Tab 2: Apple Intelligence 对话 (输入框沉底固定不动) ──
    function renderAiView() {
      viewRoot.replaceChildren();

      // 专有全屏 AI 容器，使得上部消息可滚动，底部输入区吸底不动
      const aiContainer = document.createElement('div');
      aiContainer.className = 'ai-tab-fullscreen';
      aiContainer.style.cssText = 'display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden;';

      const messageStream = createAiMessageList({
        messages: aiMessages,
        onCopy: (txt) => showToast('已安全复制 AI 建议文本')
      });
      messageStream.style.cssText = 'flex:1;overflow-y:auto;padding:14px 14px 10px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;';

      const composer = createCrystalAiComposer({
        initialDraft: aiDraftText,
        isBusy: aiIsBusy,
        onDraftChange: (d) => {
          aiDraftText = d; // 离开页面返回仍可恢复
        },
        onSend: (text) => {
          aiMessages.push({ role: 'USER', content: text });
          aiIsBusy = true;
          aiDraftText = '';
          renderAiView();

          // 自动滚动到最新消息
          setTimeout(() => {
            const streamEl = aiContainer.querySelector('.ai-messages-stream');
            if (streamEl) streamEl.scrollTop = streamEl.scrollHeight;
          }, 50);

          // 模拟智能体异步推演
          setTimeout(() => {
            aiIsBusy = false;
            aiMessages.push({
              role: 'ASSISTANT',
              content: `已完成遥测核验：针对指令【${text}】，已生成最优调控策略，系统将在下个工况周期自适应微调。`
            });
            renderAiView();
            setTimeout(() => {
              const streamEl = aiContainer.querySelector('.ai-messages-stream');
              if (streamEl) streamEl.scrollTop = streamEl.scrollHeight;
            }, 50);
          }, 900);
        }
      });

      aiContainer.append(messageStream, composer);
      viewRoot.appendChild(aiContainer);

      // 初始渲染时滚至底部
      setTimeout(() => {
        messageStream.scrollTop = messageStream.scrollHeight;
      }, 50);
    }

    // ── Tab 3: 运维审计 ──
    function renderActivityView() {
      viewRoot.replaceChildren();
      const events = [
        {
          id: 'ev-1',
          type: 'CONTROL',
          title: '循环泵频率调节指令回执',
          time: '12:08',
          desc: '下发设定值 70%，网关反馈 ACK 响应延时 14ms。'
        },
        {
          id: 'ev-2',
          type: 'ALERT',
          title: '机房微气候相对湿度自适应平衡',
          time: '11:45',
          desc: '湿度达到 48%，正压新风机自动切换低噪模式。'
        },
        {
          id: 'ev-3',
          type: 'NETWORK',
          title: 'BLE Mesh 自愈拓扑握手完成',
          time: '11:20',
          desc: '现场 6 个物联节点链路全连通，丢包率 0.00%。'
        }
      ];

      const activityNode = createActivityStreamView({ events });
      viewRoot.appendChild(activityNode);
    }

    // ── Tab 4: 近场感知与系统设置 ──
    function renderSettingsView() {
      viewRoot.replaceChildren();

      const bleView = createBleScannerView({
        isScanning: true,
        candidates: [
          { id: 'BLE-8821', name: 'DALI-2 智能网关节点', mac: 'C4:82:3F:01:A2', rssi: -48 },
          { id: 'BLE-3310', name: '高精度管网压力传感器', mac: 'E2:15:9A:88:B1', rssi: -62 }
        ],
        onToggleScan: (isScan) => showToast(isScan ? '已启动雷达感知' : '已暂停扫描'),
        onClaim: (cand) => showToast(`已认领设备入库: ${cand.name}`),
        onQrScan: () => showToast('调起扫码模块 (模拟相机感知)')
      });

      viewRoot.appendChild(bleView);
    }

    // 初始化渲染看板
    renderDevicesView();
  </script>
</body>
</html>
