<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IoT Manager project overview</title>
  <desc id="desc">A bilingual overview of the IoT Manager platform, showing mobile operations, real-time platform, live weather, and edge or BLE integration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062c35"/>
      <stop offset="1" stop-color="#0d6f73"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5f3ec" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c5f3ec" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001c24" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1090" cy="-10" r="260" fill="url(#shine)"/>
  <circle cx="80" cy="590" r="220" fill="#3ac9bc" opacity=".10"/>
  <g fill="#dffcf8">
    <text x="70" y="100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" letter-spacing="3">IOT MANAGER</text>
    <text x="70" y="154" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="800">现场设备运营平台</text>
    <text x="70" y="198" font-family="Arial, sans-serif" font-size="25" opacity=".88">Real-time IoT Operations Platform</text>
    <text x="70" y="240" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" opacity=".74">设备连接 · 实时动态 · 真实天气 · 环境风险</text>
    <text x="70" y="270" font-family="Arial, sans-serif" font-size="16" opacity=".64">Device operations · Live events · Weather · Environmental status</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="330" width="248" height="190" rx="22" fill="#f4fffd"/>
    <rect x="340" y="330" width="248" height="190" rx="22" fill="#f4fffd"/>
    <rect x="610" y="330" width="248" height="190" rx="22" fill="#f4fffd"/>
    <rect x="880" y="330" width="248" height="190" rx="22" fill="#f4fffd"/>
  </g>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g transform="translate(100 366)">
      <circle cx="24" cy="24" r="24" fill="#d7f2ef"/><path d="M17 12h14a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4zm4 4h6m-6 16h6" fill="none" stroke="#08716f" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" font-size="22" font-weight="800" fill="#17363a">手机端</text><text x="0" y="111" font-size="16" fill="#547075">Mobile / PDA</text>
      <text x="0" y="147" font-size="15" fill="#547075">定位 · 下拉刷新 · 离线缓存</text>
    </g>
    <g transform="translate(370 366)">
      <circle cx="24" cy="24" r="24" fill="#d7f2ef"/><path d="M11 31h26M15 24h18M19 17h10" fill="none" stroke="#08716f" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" font-size="22" font-weight="800" fill="#17363a">实时平台</text><text x="0" y="111" font-size="16" fill="#547075">Real-time Platform</text>
      <text x="0" y="147" font-size="15" fill="#547075">命令确认 · 遥测 · 告警</text>
    </g>
    <g transform="translate(640 366)">
      <circle cx="24" cy="24" r="24" fill="#fff1bf"/><path d="M15 31h19a7 7 0 0 0 0-14 10 10 0 0 0-19-1 7 7 0 0 0 0 15z" fill="none" stroke="#a66b00" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" font-size="22" font-weight="800" fill="#17363a">真实天气</text><text x="0" y="111" font-size="16" fill="#547075">Live Weather</text>
      <text x="0" y="147" font-size="15" fill="#547075">温湿压 · 海拔 · 风险状态</text>
    </g>
    <g transform="translate(910 366)">
      <circle cx="24" cy="24" r="24" fill="#d7f2ef"/><path d="M13 26c7-12 15 12 22 0M12 17h24M12 35h24" fill="none" stroke="#08716f" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="83" font-size="22" font-weight="800" fill="#17363a">边缘与 BLE</text><text x="0" y="111" font-size="16" fill="#547075">Edge &amp; BLE</text>
      <text x="0" y="147" font-size="15" fill="#547075">本地设备 · 云端扩展</text>
    </g>
  </g>
  <text x="70" y="582" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#c9efeb" opacity=".86">Open source MVP · Controlled pilot foundation · Not production-ready</text>
</svg>
