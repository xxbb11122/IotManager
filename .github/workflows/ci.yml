name: Quick CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_mode:
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: quick-ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ inputs.release_mode != true }}

permissions:
  contents: read

jobs:
  java:
    name: Backend and Edge Agent (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Backend, Edge Agent, and PostgreSQL Testcontainers strictly
        env:
          IOT_VERIFY_SUMMARY_FILE: ${{ runner.temp }}/iot-manager-java-summary.csv
        run: bash scripts/verify.sh --strict --skip-web --skip-deploy
      - name: Upload Java execution summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-summary-${{ github.sha }}
          path: ${{ runner.temp }}/iot-manager-java-summary.csv
          if-no-files-found: error
          retention-days: 14

  web:
    name: Frontend, Console, and Client (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            console/package-lock.json
            client/package-lock.json
      - name: Install Playwright Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify web clients strictly
        env:
          IOT_VERIFY_SUMMARY_FILE: ${{ runner.temp }}/iot-manager-web-summary.csv
        run: bash scripts/verify.sh --strict --skip-backend --skip-deploy
      - name: Upload web execution summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-test-summary-${{ github.sha }}
          path: ${{ runner.temp }}/iot-manager-web-summary.csv
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug APK (JDK 21, API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK with strict toolchain checks
        working-directory: .
        run: bash scripts/verify.sh --strict --android --skip-backend --skip-web --skip-deploy
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iot-manager-debug-apk-${{ github.sha }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy-static:
    name: Docker Compose and Caddy configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Generate ephemeral non-production Compose secrets
        run: bash scripts/runtime/new-secrets.sh "$RUNNER_TEMP/iot-manager-compose-secrets"
      - name: Validate normal and recovery Compose topology
        env:
          IOT_SECRET_DIR: ${{ runner.temp }}/iot-manager-compose-secrets
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          docker compose --profile application --profile observability \
            --env-file deploy/.env.example \
            -f deploy/docker-compose.yml \
            config --quiet
          docker compose --env-file deploy/.env.integration.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.integration.yml \
            config --quiet
          docker compose --env-file deploy/.env.integration.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.integration.yml \
            -f deploy/docker-compose.recovery.yml \
            --env-file deploy/.env.recovery-topology.example \
            config --quiet
          export IOT_BACKEND_IMAGE=ghcr.io/example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_CADDY_IMAGE=ghcr.io/example/caddy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_KEYCLOAK_IMAGE=ghcr.io/example/keycloak@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_POSTGRES_IMAGE=ghcr.io/example/postgres@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_PROMETHEUS_IMAGE=ghcr.io/example/prometheus@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_ALERTMANAGER_IMAGE=ghcr.io/example/alertmanager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_LOGICAL_BACKUP_IMAGE=postgres:16-bookworm@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export IOT_VOLUME_INIT_IMAGE=alpine:3.20@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose --env-file deploy/.env.integration.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.integration.yml \
            -f deploy/docker-compose.immutable.yml \
            config --quiet
          docker compose --env-file deploy/.env.integration.example \
            --env-file deploy/.env.recovery-topology.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.recovery.yml \
            -f deploy/docker-compose.immutable.yml \
            -f deploy/docker-compose.immutable.recovery.yml \
            config --quiet
          bash scripts/ci/discover-release-images.sh \
            --source-sha "$SOURCE_SHA" \
            --base-compose deploy/docker-compose.yml \
            --runtime-compose deploy/docker-compose.integration.yml \
            --recovery-compose deploy/docker-compose.recovery.yml \
            --env deploy/.env.integration.example \
            --profiles application,observability \
            --recovery-config-stub deploy/.env.recovery-topology.example \
            --output "$RUNNER_TEMP/release-topology.json"
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.test \
            -e ACME_EMAIL=ci@example.test \
            -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Buildx release catalog
        run: docker buildx bake -f deploy/docker-bake.hcl --print release

  source-security:
    name: Source security and repository SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1
        with:
          version: v0.70.0
          cache: true
      - name: Prepare repository security evidence directory
        run: mkdir -p artifacts/security
      - name: Scan source, dependencies, secrets, configuration, and licenses
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
      - name: Generate repository CycloneDX SBOM
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: artifacts/security/iot-manager.cdx.json
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload repository security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30

  quick-gate:
    name: quick-gate
    needs: [java, web, android-debug, deploy-static, source-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Quick CI verification domain to pass
        env:
          JAVA_RESULT: ${{ needs.java.result }}
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs['android-debug'].result }}
          DEPLOY_RESULT: ${{ needs['deploy-static'].result }}
          SECURITY_RESULT: ${{ needs['source-security'].result }}
        run: |
          set -euo pipefail
          for result in "$JAVA_RESULT" "$WEB_RESULT" "$ANDROID_RESULT" "$DEPLOY_RESULT" "$SECURITY_RESULT"; do
            test "$result" = success || {
              echo "::error::Quick CI prerequisite did not pass: $result" >&2
              exit 1
            }
          done
