name: Verify release baseline

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: ${{ matrix.component }} (JDK 17)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - edge-agent
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package component
        working-directory: ${{ matrix.component }}
        run: mvn --batch-mode --no-transfer-progress verify

  web:
    name: ${{ matrix.app }} (Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - console
          - client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Run client tests
        if: matrix.app == 'client'
        working-directory: client
        run: npm test
      - name: Build application
        working-directory: ${{ matrix.app }}
        run: npm run build

  android:
    name: Android debug APK (JDK 21, API 36)
    # Set ENABLE_ANDROID_CI=false only for an external Android runner or SDK outage.
    if: ${{ vars.ENABLE_ANDROID_CI != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and synchronize Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iot-manager-debug-apk-${{ github.sha }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy-config:
    name: Docker Compose and Caddy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose interpolation and schema
        env:
          DOMAIN: ci.example.test
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.test \
            -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build deployable backend and static web images
        env:
          DOMAIN: ci.example.test
        run: docker compose -f deploy/docker-compose.yml build
