name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-services:
    name: Backend and Edge Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend and Edge Agent
        run: bash scripts/verify.sh --skip-web --skip-deploy

  web-clients:
    name: Web and client applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            console/package-lock.json
            client/package-lock.json
      - name: Install Playwright Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify all Vite applications and client tests
        run: bash scripts/verify.sh --skip-backend --skip-deploy

  android:
    name: Android debug package
    if: ${{ vars.ENABLE_ANDROID_CI != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36 build prerequisites
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: bash scripts/verify.sh --skip-backend --skip-web --skip-deploy --android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iot-manager-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  deployment:
    name: Deployment assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose interpolation
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.test \
            -e ACME_EMAIL=ci@example.test \
            -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backend container image
        run: docker build -f deploy/Dockerfile -t iot-manager-backend-ci .
      - name: Build static web container image
        run: docker build -f deploy/Caddy.Dockerfile -t iot-manager-web-ci .
