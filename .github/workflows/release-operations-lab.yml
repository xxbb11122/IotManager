name: Release Operations Simulation
on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: Existing eight-image producer run for laboratory fixtures
        required: true
        type: string
      candidate_id:
        description: Exact laboratory image candidate ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: release-operations-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  operational-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test guards, plans and real laboratory keystore
        run: node --test scripts/ci/tests/release-operations.test.mjs scripts/ci/tests/android-signing-setup.test.mjs
      - name: Check Linux host prerequisites without registering a runner
        run: bash scripts/ops/recovery-runner.sh check
      - name: Download frozen laboratory image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_ID" =~ ^[a-z0-9-]+$ ]]
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-manifest-$CANDIDATE_ID" --dir artifacts/ops-release
          node scripts/ci/release-tools.mjs validate-digest-manifest --candidate artifacts/ops-release/release-candidate.json --topology artifacts/ops-release/release-topology.json --services artifacts/ops-release/release-services.json --manifest artifacts/ops-release/image-digests.json --expected-release-candidate-id "$CANDIDATE_ID"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Exercise real migration, permissions, refusal cases and new backup chain
        run: bash scripts/testing/release-ops/run.sh
      - name: Upload public synthetic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-operations-lab-${{ github.run_id }}
          path: artifacts/release-ops/
          if-no-files-found: error
          retention-days: 30
