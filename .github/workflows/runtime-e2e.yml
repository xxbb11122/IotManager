name: P0 Docker Runtime

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_candidate_id:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      image_evidence_artifact:
        required: true
        type: string
      image_producer_run_id:
        required: true
        type: string
      image_producer_run_attempt:
        required: true
        type: string
      caller_workflow_ref_raw:
        required: true
        type: string
      caller_workflow_sha:
        required: true
        type: string
      orchestrator_run_id:
        required: true
        type: string
    outputs:
      producer_run_id:
        description: Exact immutable runtime producer run
        value: ${{ jobs['immutable-release-runtime'].outputs.producer_run_id }}
      producer_run_attempt:
        description: Exact immutable runtime producer attempt
        value: ${{ jobs['immutable-release-runtime'].outputs.producer_run_attempt }}
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "edge-agent/**"
      - "deploy/**"
      - "scripts/runtime/**"
      - "frontend/**"
      - "console/**"
      - "profiles/**"
      - "shared/**"
      - "client/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - master
      - "codex/**"
    paths:
      - "backend/**"
      - "edge-agent/**"
      - "deploy/**"
      - "scripts/runtime/**"
      - "frontend/**"
      - "console/**"
      - "profiles/**"
      - "shared/**"
      - "client/**"
      - ".github/workflows/**"

concurrency:
  group: p0-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  packages: read

jobs:
  full-stack:
    if: ${{ github.event_name != 'workflow_call' }}
    name: Compose, Keycloak, PostgreSQL, Caddy, Backend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IOT_COMPOSE_PROJECT: iot-manager-p0
      IOT_ENVIRONMENT_FILE: ${{ github.workspace }}/deploy/.env.integration
      IOT_RUNTIME_STATE_FILE: ${{ github.workspace }}/deploy/.runtime/iot-manager-p0/runtime.env
      IOT_RUNTIME_TIMEOUT_SECONDS: "300"
      # S3 observability is part of the R1 pilot surface. The profile remains
      # internal-only and has no published host port.
      IOT_ENABLE_OBSERVABILITY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Create non-secret integration configuration
        run: cp deploy/.env.integration.example deploy/.env.integration

      - name: Validate Compose configuration before startup
        run: docker compose --env-file deploy/.env.integration -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml config --quiet

      - name: Start the two-phase integration stack
        run: bash scripts/runtime/start-integration.sh

      - name: Verify non-root PostgreSQL and Caddy runtime hardening
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml)
          postgres_id="$("${compose[@]}" ps -q postgres)"
          caddy_id="$("${compose[@]}" ps -q caddy)"
          backup_id="$("${compose[@]}" --profile application ps -q backup)"
          test -n "$postgres_id"
          test -n "$caddy_id"
          test -n "$backup_id"

          test "$(docker exec "$postgres_id" id -u)" = '999'
          # The pinned Caddy image is intentionally minimal and has no `id`
          # binary. `docker top` verifies the actual process UID instead of
          # weakening this to a configuration-only assertion.
          docker top "$caddy_id" -eo pid,uid | awk 'NR > 1 && $2 == "65534" { found = 1 } END { exit !found }'
          test "$(docker exec "$backup_id" id -u)" = '999'
          test "$(docker inspect --format '{{.Config.User}}' "$postgres_id")" = 'postgres'
          test "$(docker inspect --format '{{.Config.User}}' "$caddy_id")" = '65534:65534'
          test "$(docker inspect --format '{{.Config.User}}' "$backup_id")" = '999:999'

          caddy_cap_add="$(docker inspect --format '{{json .HostConfig.CapAdd}}' "$caddy_id")"
          caddy_cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$caddy_id")"
          backup_cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$backup_id")"
          test "$caddy_cap_add" = '["CAP_NET_BIND_SERVICE"]'
          test "$caddy_cap_drop" = '["ALL"]'
          test "$backup_cap_drop" = '["ALL"]'

      - name: Run runtime smoke and boundary checks
        run: bash scripts/runtime/verify-stack.sh

      - name: Verify Backend database role cannot perform DDL
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml)
          denial_log="$RUNNER_TEMP/application-ddl-denial.log"
          table_name="p0_runtime_ddl_denied_${GITHUB_RUN_ID:-$$}"
          "${compose[@]}" exec -T postgres application-role-psql.sh \
            -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -c "CREATE TABLE ${table_name} (id integer)" >"$denial_log" 2>&1 && {
              echo "Application role unexpectedly created a table" >&2
              exit 1
            }
          if ! grep -Fq 'ERROR:  42501:' "$denial_log"; then
            echo '::error::Application DDL probe failed for a reason other than PostgreSQL privilege denial.' >&2
            cat "$denial_log" >&2
            exit 1
          fi

      - name: Verify owner-only backup exports recovery-drill relations
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml)
          backup_id="$("${compose[@]}" ps -q backup)"
          test -n "$backup_id"
          # Compose file secrets are bind mounts and retain the host UID. The
          # initializer must instead provide this non-root sidecar a private,
          # read-only volume containing only its owner credential.
          backup_secret_file="$(docker exec "$backup_id" sh -ec 'test -r /run/secrets/iot_db_owner_password && stat -c "%u:%g:%a" /run/secrets/iot_db_owner_password')"
          test "$backup_secret_file" = '999:999:400'
          if docker exec "$backup_id" sh -ec 'test -e /run/secrets/iot_db_app_password'; then
            echo '::error::Backup sidecar must not mount the Backend DML password.' >&2
            exit 1
          fi

          bootstrap_user="$(sed -n 's/^POSTGRES_BOOTSTRAP_USERNAME=//p' "$IOT_ENVIRONMENT_FILE" | tail -n 1 | tr -d '\r')"
          database_name="$(sed -n 's/^IOT_DB_DATABASE=//p' "$IOT_ENVIRONMENT_FILE" | tail -n 1 | tr -d '\r')"
          owner_user="$(sed -n 's/^IOT_DB_OWNER_USERNAME=//p' "$IOT_ENVIRONMENT_FILE" | tail -n 1 | tr -d '\r')"
          test -n "$bootstrap_user"
          test -n "$database_name"
          test -n "$owner_user"
          marker_id="runtime-owner-backup-${GITHUB_RUN_ID:-$$}"
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U "$bootstrap_user" -d "$database_name" \
            -v owner_user="$owner_user" -v marker_id="$marker_id" <<'SQL'
          BEGIN;
          CREATE SCHEMA IF NOT EXISTS r1_recovery_drill AUTHORIZATION :"owner_user";
          ALTER SCHEMA r1_recovery_drill OWNER TO :"owner_user";
          CREATE TABLE IF NOT EXISTS r1_recovery_drill.markers (
            marker_id text PRIMARY KEY,
            created_at timestamptz NOT NULL DEFAULT clock_timestamp()
          );
          ALTER TABLE r1_recovery_drill.markers OWNER TO :"owner_user";
          INSERT INTO r1_recovery_drill.markers (marker_id) VALUES (:'marker_id');
          COMMIT;
          SQL
          "${compose[@]}" run --rm --no-deps backup /bin/sh /scripts/backup.sh
          backup_path="$("${compose[@]}" exec -T backup sh -ec 'ls -1t /backups/*.dump | head -n 1')"
          test -n "$backup_path"
          backup_listing="$("${compose[@]}" exec -T backup pg_restore -l "$backup_path")"
          grep -Fq "SCHEMA - r1_recovery_drill $owner_user" <<<"$backup_listing"
          grep -Fq "TABLE r1_recovery_drill markers $owner_user" <<<"$backup_listing"

      - name: Install Chromium for real PKCE browser tests
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run PKCE, JWT API, four-role RBAC, session lifecycle, browser WSS, and edge-credential WSS tests
        working-directory: client
        run: |
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f ../deploy/docker-compose.yml -f ../deploy/docker-compose.integration.yml)
          "${compose[@]}" cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/iot-manager-root.crt"
          sudo install -m 0644 "$RUNNER_TEMP/iot-manager-root.crt" /usr/local/share/ca-certificates/iot-manager-root.crt
          sudo update-ca-certificates
          # Playwright's bundled Chromium reads the runner user's NSS trust
          # database rather than reliably reloading the Debian CA bundle.
          # Trust only this ephemeral Caddy root in the disposable CI user;
          # the browser test remains a normal certificate-verified HTTPS flow.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools
          nss_database="$HOME/.pki/nssdb"
          install -d -m 0700 "$nss_database"
          if [ ! -f "$nss_database/cert9.db" ]; then
            certutil -d "sql:$nss_database" -N --empty-password
          fi
          certutil -d "sql:$nss_database" -D -n iot-manager-runtime-local-ca >/dev/null 2>&1 || true
          certutil -d "sql:$nss_database" -A -t 'C,,' -n iot-manager-runtime-local-ca -i "$RUNNER_TEMP/iot-manager-root.crt"
          certutil -d "sql:$nss_database" -L -n iot-manager-runtime-local-ca
          owner_password="$(cat ../deploy/.runtime/iot-manager-p0/secrets/keycloak_owner_password)"
          admin_password="$(cat ../deploy/.runtime/iot-manager-p0/secrets/keycloak_admin_password)"
          operator_password="$(cat ../deploy/.runtime/iot-manager-p0/secrets/keycloak_operator_password)"
          viewer_password="$(cat ../deploy/.runtime/iot-manager-p0/secrets/keycloak_viewer_password)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$operator_password"
          echo "::add-mask::$viewer_password"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/iot-manager-root.crt" \
          IOT_RUNTIME_CA_CERTIFICATE="$RUNNER_TEMP/iot-manager-root.crt" \
          IOT_RUNTIME_BASE_URL=https://iot-manager.localhost \
          IOT_E2E_OWNER_USERNAME=integration-owner \
          IOT_E2E_OWNER_PASSWORD="$owner_password" \
          IOT_E2E_ADMIN_USERNAME=integration-admin \
          IOT_E2E_ADMIN_PASSWORD="$admin_password" \
          IOT_E2E_OPERATOR_USERNAME=integration-operator \
          IOT_E2E_OPERATOR_PASSWORD="$operator_password" \
          IOT_E2E_VIEWER_USERNAME=integration-viewer \
          IOT_E2E_VIEWER_PASSWORD="$viewer_password" \
          npx playwright test e2e/runtime-auth.spec.js

      - name: Verify PostgreSQL restart persistence and Backend fail-closed readiness
        env:
          IOT_RESILIENCE_CONFIRM: RESILIENCE
        run: bash scripts/runtime/verify-resilience.sh

      - name: Restore a logical backup into an independent Compose project
        run: |
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml)
          backup_path="$("${compose[@]}" exec -T backup sh -ec 'ls -1t /backups/*.dump | head -n 1')"
          test -n "$backup_path"
          backup_name="$(basename "$backup_path")"
          "${compose[@]}" cp "backup:$backup_path" "$RUNNER_TEMP/$backup_name"
          "${compose[@]}" cp "backup:$backup_path.sha256" "$RUNNER_TEMP/$backup_name.sha256"
          # The owner-only backup sidecar creates its dump pair under umask
          # 077. Docker's container-to-host copy preserves that restrictive
          # mode, but the isolated recovery sidecar deliberately runs as UID
          # 999 rather than the GitHub runner UID. The files are read-only
          # bind mounts in this disposable runner-only directory, so expose
          # exactly the read bit that lets the non-root verifier consume the
          # pair without relaxing any production backup volume permission.
          chmod 0644 "$RUNNER_TEMP/$backup_name" "$RUNNER_TEMP/$backup_name.sha256"
          IOT_RESTORE_CONFIRM=RESTORE bash scripts/runtime/recovery-drill.sh "$RUNNER_TEMP/$backup_name"

      - name: Refuse a tampered logical backup before restore
        run: |
          set -euo pipefail
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml)
          backup_path="$("${compose[@]}" exec -T backup sh -ec 'ls -1t /backups/*.dump | head -n 1')"
          test -n "$backup_path"
          backup_name="$(basename "$backup_path")"
          tampered_dump="$RUNNER_TEMP/tampered-$backup_name"
          cp "$RUNNER_TEMP/$backup_name" "$tampered_dump"
          cp "$RUNNER_TEMP/$backup_name.sha256" "$tampered_dump.sha256"
          printf 'tamper-proof-negative-test' >> "$tampered_dump"
          if "${compose[@]}" run --rm --no-deps \
            -e IOT_RESTORE_CONFIRM=RESTORE \
            -v "$tampered_dump:/restore/$backup_name:ro" \
            -v "$tampered_dump.sha256:/restore/$backup_name.sha256:ro" \
            backup /bin/sh /scripts/restore.sh "/restore/$backup_name"; then
            echo '::error::A checksum-mismatched backup unexpectedly reached restore.' >&2
            exit 1
          fi

      - name: Collect redacted Compose diagnostics on failure
        if: ${{ failure() }}
        run: bash scripts/runtime/collect-runtime-diagnostics.sh || true

      - name: Refuse runtime evidence containing generated Secret values
        id: artifact-scan
        if: ${{ always() }}
        run: |
          scan_paths=(artifacts/p0-runtime client/test-results)
          for secret_file in deploy/.runtime/iot-manager-p0/secrets/*; do
            test -f "$secret_file" || continue
            secret_value="$(cat "$secret_file")"
            test -n "$secret_value" || continue
            if grep -R -a -F -q -- "$secret_value" "${scan_paths[@]}" 2>/dev/null; then
              echo "::error::Refusing artifact upload because a generated secret value was found in runtime evidence."
              exit 1
            fi
          done
          if grep -R -a -E -q -- 'iat_[A-Za-z0-9_-]{20,}' "${scan_paths[@]}" 2>/dev/null; then
            echo "::error::Refusing artifact upload because a one-time edge-agent credential token was found in runtime evidence."
            exit 1
          fi

      - name: Upload redacted runtime evidence
        if: ${{ always() && steps.artifact-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-runtime-evidence-${{ github.sha }}
          path: |
            artifacts/p0-runtime/
            client/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop only the dedicated Compose projects
        if: ${{ always() }}
        run: |
          docker compose --project-name iot-manager-p0 --env-file deploy/.env.integration --env-file deploy/.runtime/iot-manager-p0/runtime.env -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml down --remove-orphans || true
          docker compose --project-name iot-manager-p0-recovery --env-file deploy/.env.integration -f deploy/docker-compose.yml -f deploy/docker-compose.integration.yml down --remove-orphans || true
          rm -rf deploy/.runtime

  immutable-release-runtime:
    if: ${{ github.event_name == 'workflow_call' }}
    name: Immutable 12-service runtime evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      producer_run_id: ${{ steps.stage-handoff.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.stage-handoff.outputs.producer_run_attempt }}
    env:
      IOT_COMPOSE_PROJECT: iot-manager-release-${{ github.run_id }}
      IOT_ENVIRONMENT_FILE: ${{ github.workspace }}/deploy/.env.integration
      IOT_RUNTIME_STATE_FILE: ${{ github.workspace }}/deploy/.runtime/iot-manager-release-${{ github.run_id }}/runtime.env
      IOT_ENABLE_OBSERVABILITY: "true"
      IOT_RELEASE_CANDIDATE_ID: ${{ inputs.release_candidate_id }}
      IOT_SOURCE_SHA: ${{ inputs.source_sha }}
      IOT_IMAGE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Assert exact source checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash scripts/ci/assert-source-checkout.sh --source-sha "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.image_evidence_artifact }}
          path: artifacts
      - name: Verify exact image handoff, trusted producer, and pull immutable images
        env:
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          EXPECTED_CANDIDATE_ID: ${{ inputs.release_candidate_id }}
          IMAGE_PRODUCER_RUN_ID: ${{ inputs.image_producer_run_id }}
          IMAGE_PRODUCER_RUN_ATTEMPT: ${{ inputs.image_producer_run_attempt }}
        run: |
          set -euo pipefail
          test -f artifacts/release/release-candidate.json
          test -f artifacts/release/release-topology.json
          test -f artifacts/release/release-services.json
          test -f artifacts/release/image-digests.json
          test -f artifacts/release/image-digests.json.sha256
          test -f artifacts/release/stage-image.json
          test -f artifacts/release/stage-image.json.sha256
          sha256sum -c artifacts/release/image-digests.json.sha256
          bash scripts/ci/validate-stage-handoff.sh \
            --candidate artifacts/release/release-candidate.json \
            --stage artifacts/release/stage-image.json \
            --artifact artifacts/release/stage-image.json \
            --artifact-sha256 artifacts/release/stage-image.json.sha256 \
            --expected-stage image \
            --producer-run-id "$IMAGE_PRODUCER_RUN_ID" \
            --producer-run-attempt "$IMAGE_PRODUCER_RUN_ATTEMPT" \
            --producer-job image-security-aggregate \
            --artifact-name "${{ inputs.image_evidence_artifact }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --approved-repository "$GITHUB_REPOSITORY" \
            --approved-producer-path .github/workflows/image-security.yml \
            --approved-caller-path .github/workflows/release-gate.yml \
            --allowed-event workflow_call \
            --allowed-invocation-mode orchestrated-reusable
          bash scripts/ci/validate-digest-manifest.sh \
            --candidate artifacts/release/release-candidate.json \
            --topology artifacts/release/release-topology.json \
            --services artifacts/release/release-services.json \
            --manifest artifacts/release/image-digests.json \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-release-candidate-id "$EXPECTED_CANDIDATE_ID" \
            --expected-source-sha "${{ inputs.source_sha }}"
          actual_manifest="$(sha256sum artifacts/release/image-digests.json | awk '{print $1}')"
          test "$actual_manifest" = "$EXPECTED_MANIFEST_SHA256"
          candidate_id="$(node -e "console.log(require('./artifacts/release/release-candidate.json').releaseCandidateId)")"
          test "$candidate_id" = "$EXPECTED_CANDIDATE_ID"
          while IFS=$'\t' read -r artifact_id image_ref; do
            docker pull "$image_ref"
          done < <(bash scripts/ci/list-digest-artifacts.sh --manifest artifacts/release/image-digests.json)
      - name: Start immutable integration stack and collect 12 of 12 service evidence
        run: |
          set -euo pipefail
          cp deploy/.env.integration.example deploy/.env.integration
          bash scripts/runtime/start-integration.sh \
            --verify \
            --mode immutable \
            --digest-manifest artifacts/release/image-digests.json \
            --release-services artifacts/release/release-services.json
      - name: Run PKCE, JWT, RBAC, WSS, and edge-credential checks against immutable images
        working-directory: client
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file "$IOT_RUNTIME_STATE_FILE" --env-file ../artifacts/release/image-digests.env -f ../deploy/docker-compose.yml -f ../deploy/docker-compose.integration.yml -f ../deploy/docker-compose.immutable.yml)
          "${compose[@]}" cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/iot-manager-release-root.crt"
          sudo install -m 0644 "$RUNNER_TEMP/iot-manager-release-root.crt" /usr/local/share/ca-certificates/iot-manager-release-root.crt
          sudo update-ca-certificates
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools
          nss_database="$HOME/.pki/nssdb"
          install -d -m 0700 "$nss_database"
          if [ ! -f "$nss_database/cert9.db" ]; then
            certutil -d "sql:$nss_database" -N --empty-password
          fi
          certutil -d "sql:$nss_database" -D -n iot-manager-release-local-ca >/dev/null 2>&1 || true
          certutil -d "sql:$nss_database" -A -t 'C,,' -n iot-manager-release-local-ca -i "$RUNNER_TEMP/iot-manager-release-root.crt"
          owner_password="$(cat ../deploy/.runtime/iot-manager-release-${GITHUB_RUN_ID}/secrets/keycloak_owner_password)"
          admin_password="$(cat ../deploy/.runtime/iot-manager-release-${GITHUB_RUN_ID}/secrets/keycloak_admin_password)"
          operator_password="$(cat ../deploy/.runtime/iot-manager-release-${GITHUB_RUN_ID}/secrets/keycloak_operator_password)"
          viewer_password="$(cat ../deploy/.runtime/iot-manager-release-${GITHUB_RUN_ID}/secrets/keycloak_viewer_password)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$operator_password"
          echo "::add-mask::$viewer_password"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/iot-manager-release-root.crt" \
          IOT_RUNTIME_CA_CERTIFICATE="$RUNNER_TEMP/iot-manager-release-root.crt" \
          IOT_RUNTIME_BASE_URL=https://iot-manager.localhost \
          IOT_E2E_OWNER_USERNAME=integration-owner \
          IOT_E2E_OWNER_PASSWORD="$owner_password" \
          IOT_E2E_ADMIN_USERNAME=integration-admin \
          IOT_E2E_ADMIN_PASSWORD="$admin_password" \
          IOT_E2E_OPERATOR_USERNAME=integration-operator \
          IOT_E2E_OPERATOR_PASSWORD="$operator_password" \
          IOT_E2E_VIEWER_USERNAME=integration-viewer \
          IOT_E2E_VIEWER_PASSWORD="$viewer_password" \
          npx playwright test e2e/runtime-auth.spec.js
      - name: Validate normal runtime evidence is complete
        run: |
          set -euo pipefail
          node -e "const e=require('./artifacts/release/runtime-service-digests.json'); if(e.status !== 'PASS' || e.verifiedServiceCount !== 12 || e.expectedServiceCount !== 12) process.exit(1)"
      - name: Write runtime stage handoff result
        id: stage-handoff
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALLER_REF_RAW: ${{ inputs.caller_workflow_ref_raw }}
          CALLER_WORKFLOW_SHA: ${{ inputs.caller_workflow_sha }}
        run: |
          set -euo pipefail
          caller_path="$(sed -E 's#^[^/]*/[^/]*/(.+)@.*$#\1#' <<< "$CALLER_REF_RAW")"
          bash scripts/ci/write-stage-result.sh \
            --candidate artifacts/release/release-candidate.json \
            --manifest artifacts/release/image-digests.json \
            --stage runtime \
            --checked-out-source-sha "$SOURCE_SHA" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-event "$GITHUB_EVENT_NAME" \
            --invocation-mode orchestrated-reusable \
            --caller-repository "$GITHUB_REPOSITORY" \
            --caller-workflow-ref-raw "$CALLER_REF_RAW" \
            --caller-workflow-sha "$CALLER_WORKFLOW_SHA" \
            --caller-workflow-path "$caller_path" \
            --caller-workflow-identity "$GITHUB_REPOSITORY/$caller_path@$CALLER_WORKFLOW_SHA" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-workflow-ref-raw "${{ job.workflow_ref || github.workflow_ref }}" \
            --producer-workflow-sha "${{ job.workflow_sha || github.workflow_sha }}" \
            --producer-job immutable-release-runtime \
            --artifact-name "immutable-runtime-${{ inputs.release_candidate_id }}" \
            --orchestrator-run-id "${{ inputs.orchestrator_run_id }}" \
            --runner-class github-hosted \
            --output artifacts/release/stage-runtime.json
          echo "producer_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "producer_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-runtime-${{ inputs.release_candidate_id }}
          path: |
            artifacts/release/
            artifacts/p0-runtime/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop only the release Compose project
        if: ${{ always() }}
        run: |
          docker compose --project-name "$IOT_COMPOSE_PROJECT" \
            --env-file deploy/.env.integration \
            --env-file "$IOT_RUNTIME_STATE_FILE" \
            --env-file artifacts/release/image-digests.env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.integration.yml \
            -f deploy/docker-compose.immutable.yml \
            down --remove-orphans || true
          rm -rf deploy/.runtime deploy/.env.integration
