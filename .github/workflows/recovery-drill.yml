name: Protected WAL-G Recovery Drill

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_candidate_id:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      image_evidence_artifact:
        required: true
        type: string
      image_producer_run_id:
        required: true
        type: string
      image_producer_run_attempt:
        required: true
        type: string
      source_project:
        required: true
        type: string
      caller_workflow_ref_raw:
        required: true
        type: string
      caller_workflow_sha:
        required: true
        type: string
      orchestrator_run_id:
        required: true
        type: string
    outputs:
      producer_run_id:
        description: Exact immutable recovery producer run
        value: ${{ jobs['immutable-physical-recovery'].outputs.producer_run_id }}
      producer_run_attempt:
        description: Exact immutable recovery producer attempt
        value: ${{ jobs['immutable-physical-recovery'].outputs.producer_run_attempt }}
  workflow_dispatch:
    inputs:
      source_project:
        description: Existing approved source Compose project (never the recovery target)
        required: true
        default: iot-manager
        type: string
  # A real protected runner performs the scheduled drill only after the
  # repository variable IOT_RECOVERY_SOURCE_PROJECT identifies the approved
  # source Compose project. The workflow fails closed rather than guessing a
  # production target.
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: protected-wal-g-recovery-drill
  cancel-in-progress: false

jobs:
  physical-recovery:
    if: ${{ github.event_name != 'workflow_call' }}
    # This runner must be a protected, network-restricted host that can reach
    # both the running source Compose project and the approved recovery bucket.
    # Do not switch this to GitHub-hosted runners: they cannot validate the
    # production recovery path and would turn this into a synthetic test.
    runs-on: [self-hosted, linux, iot-manager-recovery]
    environment: r1-recovery-drill
    timeout-minutes: 75
    env:
      IOT_COMPOSE_PROJECT: ${{ inputs.source_project || vars.IOT_RECOVERY_SOURCE_PROJECT }}
      IOT_RECOVERY_PROJECT: iot-manager-gate2-pitr-${{ github.run_id }}
      IOT_ENVIRONMENT_FILE: ${{ github.workspace }}/deploy/.env.recovery
      IOT_RECOVERY_REPORT_DIR: ${{ github.workspace }}/artifacts/recovery-drill/${{ github.run_id }}
      IOT_RECOVERY_TIMEOUT_SECONDS: "3600"
      IOT_EXPECTED_FLYWAY_VERSION: "18"
      IOT_RECOVERY_ENV_FILE_BASE64: ${{ secrets.IOT_RECOVERY_ENV_FILE_BASE64 }}
      IOT_RECOVERY_SECRETS_TGZ_BASE64: ${{ secrets.IOT_RECOVERY_SECRETS_TGZ_BASE64 }}
    steps:
      - name: Check out the approved Git SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Materialize protected recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOT_COMPOSE_PROJECT" || {
            echo '::error::Set repository variable IOT_RECOVERY_SOURCE_PROJECT before enabling scheduled recovery drills.' >&2
            exit 64
          }
          test -n "$IOT_RECOVERY_ENV_FILE_BASE64"
          test -n "$IOT_RECOVERY_SECRETS_TGZ_BASE64"
          printf '%s' "$IOT_RECOVERY_ENV_FILE_BASE64" | base64 --decode > deploy/.env.recovery
          install -d -m 0700 deploy/.runtime/recovery-secrets
          printf '%s' "$IOT_RECOVERY_SECRETS_TGZ_BASE64" | base64 --decode | tar -xzf - -C deploy/.runtime/recovery-secrets
          chmod 0700 deploy/.runtime/recovery-secrets
          find deploy/.runtime/recovery-secrets -type f -exec chmod 0400 {} +
          required=(postgres_admin_password iot_db_owner_password iot_db_app_password keycloak_db_password walg_s3_access_key walg_s3_secret_key)
          for secret_name in "${required[@]}"; do
            test -s "deploy/.runtime/recovery-secrets/$secret_name"
          done
          # The protected env template carries only non-secret values. Make
          # the checked secret directory authoritative for this runner.
          printf '\nIOT_SECRET_DIR=%s\n' "$GITHUB_WORKSPACE/deploy/.runtime/recovery-secrets" >> deploy/.env.recovery
          grep -q '^WALG_STORAGE_MODE=s3$' deploy/.env.recovery

      - name: Validate physical recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          # The real drill creates and exports a named PostgreSQL restore
          # point after its marker commit. Configuration validation only needs
          # a syntactically valid placeholder; a wall-clock target is unsafe
          # when the source becomes quiet after WAL upload.
          export IOT_RECOVERY_TARGET_NAME=validation_restore_point
          export IOT_RECOVERY_BASE_BACKUP=base_validation_placeholder
          docker compose --project-name "$IOT_RECOVERY_PROJECT" --env-file "$IOT_ENVIRONMENT_FILE" \
            -f deploy/docker-compose.yml -f deploy/docker-compose.recovery.yml config --quiet
          docker info >/dev/null

      - name: Run isolated WAL-G physical recovery drill
        shell: bash
        run: IOT_PITR_CONFIRM=PITR bash scripts/runtime/wal-recovery-drill.sh

      - name: Refuse recovery evidence containing a protected secret
        id: artifact-scan
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          report_root="${IOT_RECOVERY_REPORT_DIR}"
          test -d "$report_root" || exit 0
          for secret_file in deploy/.runtime/recovery-secrets/*; do
            test -f "$secret_file" || continue
            secret_value="$(cat "$secret_file")"
            test -n "$secret_value" || continue
            if grep -R -a -F -q -- "$secret_value" "$report_root"; then
              echo '::error::Refusing recovery evidence upload because it contains a protected secret.'
              exit 1
            fi
          done

      - name: Upload redacted recovery evidence
        if: ${{ always() && steps.artifact-scan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wal-g-recovery-drill-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/recovery-drill/
          if-no-files-found: warn
          retention-days: 90

      - name: Remove only this workflow's isolated recovery target
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IOT_RECOVERY_PROJECT" in
            iot-manager-gate2-pitr-*) ;;
            *) echo 'Refusing to remove a non-workflow recovery project.' >&2; exit 1 ;;
          esac
          export IOT_RECOVERY_TARGET_NAME=cleanup_restore_point
          export IOT_RECOVERY_BASE_BACKUP=base_cleanup_placeholder
          docker compose --project-name "$IOT_RECOVERY_PROJECT" --env-file "$IOT_ENVIRONMENT_FILE" \
            -f deploy/docker-compose.yml -f deploy/docker-compose.recovery.yml down -v --remove-orphans || true
          rm -rf deploy/.runtime deploy/.env.recovery

  immutable-physical-recovery:
    if: ${{ github.event_name == 'workflow_call' }}
    name: Immutable WAL-G Recovery Evidence
    runs-on: [self-hosted, linux, iot-manager-recovery]
    environment: r1-recovery-drill
    timeout-minutes: 75
    outputs:
      producer_run_id: ${{ steps.stage-handoff.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.stage-handoff.outputs.producer_run_attempt }}
    env:
      IOT_COMPOSE_PROJECT: ${{ inputs.source_project }}
      IOT_RECOVERY_PROJECT: iot-manager-release-pitr-${{ github.run_id }}
      IOT_LOGICAL_RECOVERY_PROJECT: iot-manager-release-logical-${{ github.run_id }}
      IOT_ENVIRONMENT_FILE: ${{ github.workspace }}/deploy/.env.recovery
      IOT_RECOVERY_REPORT_DIR: ${{ github.workspace }}/artifacts/recovery-drill/${{ github.run_id }}
      IOT_RECOVERY_TIMEOUT_SECONDS: "3600"
      IOT_EXPECTED_FLYWAY_VERSION: "18"
      IOT_RECOVERY_ENV_FILE_BASE64: ${{ secrets.IOT_RECOVERY_ENV_FILE_BASE64 }}
      IOT_RECOVERY_SECRETS_TGZ_BASE64: ${{ secrets.IOT_RECOVERY_SECRETS_TGZ_BASE64 }}
      IOT_RELEASE_CANDIDATE_ID: ${{ inputs.release_candidate_id }}
      IOT_SOURCE_SHA: ${{ inputs.source_sha }}
      IOT_IMAGE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Assert exact source checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash scripts/ci/assert-source-checkout.sh --source-sha "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.image_evidence_artifact }}
          path: artifacts
      - name: Verify immutable image handoff, trusted producer, and pull exact digests
        env:
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          EXPECTED_CANDIDATE_ID: ${{ inputs.release_candidate_id }}
          IMAGE_PRODUCER_RUN_ID: ${{ inputs.image_producer_run_id }}
          IMAGE_PRODUCER_RUN_ATTEMPT: ${{ inputs.image_producer_run_attempt }}
        run: |
          set -euo pipefail
          test -f artifacts/release/release-candidate.json
          test -f artifacts/release/release-topology.json
          test -f artifacts/release/release-services.json
          test -f artifacts/release/stage-image.json
          test -f artifacts/release/stage-image.json.sha256
          sha256sum -c artifacts/release/image-digests.json.sha256
          bash scripts/ci/validate-stage-handoff.sh \
            --candidate artifacts/release/release-candidate.json \
            --stage artifacts/release/stage-image.json \
            --artifact artifacts/release/stage-image.json \
            --artifact-sha256 artifacts/release/stage-image.json.sha256 \
            --expected-stage image \
            --producer-run-id "$IMAGE_PRODUCER_RUN_ID" \
            --producer-run-attempt "$IMAGE_PRODUCER_RUN_ATTEMPT" \
            --producer-job image-security-aggregate \
            --artifact-name "${{ inputs.image_evidence_artifact }}" \
            --source-sha "${{ inputs.source_sha }}" \
            --approved-repository "$GITHUB_REPOSITORY" \
            --approved-producer-path .github/workflows/image-security.yml \
            --approved-caller-path .github/workflows/release-gate.yml \
            --allowed-event workflow_call \
            --allowed-invocation-mode orchestrated-reusable
          bash scripts/ci/validate-digest-manifest.sh \
            --candidate artifacts/release/release-candidate.json \
            --topology artifacts/release/release-topology.json \
            --services artifacts/release/release-services.json \
            --manifest artifacts/release/image-digests.json \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --expected-release-candidate-id "$EXPECTED_CANDIDATE_ID" \
            --expected-source-sha "${{ inputs.source_sha }}"
          test "$(sha256sum artifacts/release/image-digests.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(node -e "console.log(require('./artifacts/release/release-candidate.json').releaseCandidateId)")" = "$EXPECTED_CANDIDATE_ID"
          while IFS=$'\t' read -r artifact_id image_ref; do
            docker pull "$image_ref"
          done < <(bash scripts/ci/list-digest-artifacts.sh --manifest artifacts/release/image-digests.json)
      - name: Materialize protected recovery configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOT_COMPOSE_PROJECT"
          test -n "$IOT_RECOVERY_ENV_FILE_BASE64"
          test -n "$IOT_RECOVERY_SECRETS_TGZ_BASE64"
          printf '%s' "$IOT_RECOVERY_ENV_FILE_BASE64" | base64 --decode > deploy/.env.recovery
          install -d -m 0700 deploy/.runtime/recovery-secrets
          printf '%s' "$IOT_RECOVERY_SECRETS_TGZ_BASE64" | base64 --decode | tar -xzf - -C deploy/.runtime/recovery-secrets
          chmod 0700 deploy/.runtime/recovery-secrets
          find deploy/.runtime/recovery-secrets -type f -exec chmod 0400 {} +
          required=(postgres_admin_password iot_db_owner_password iot_db_app_password keycloak_db_password walg_s3_access_key walg_s3_secret_key)
          for secret_name in "${required[@]}"; do
            test -s "deploy/.runtime/recovery-secrets/$secret_name"
          done
          printf '\nIOT_SECRET_DIR=%s\n' "$GITHUB_WORKSPACE/deploy/.runtime/recovery-secrets" >> deploy/.env.recovery
          grep -q '^WALG_STORAGE_MODE=s3$' deploy/.env.recovery
      - name: Validate immutable physical recovery configuration
        run: |
          set -euo pipefail
          export IOT_RECOVERY_TARGET_NAME=validation_restore_point
          export IOT_RECOVERY_BASE_BACKUP=base_validation_placeholder
          docker compose --project-name "$IOT_RECOVERY_PROJECT" \
            --env-file "$IOT_ENVIRONMENT_FILE" \
            --env-file artifacts/release/image-digests.env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.recovery.yml \
            -f deploy/docker-compose.immutable.yml \
            -f deploy/docker-compose.immutable.recovery.yml \
            config --quiet
      - name: Run protected immutable logical recovery drill
        run: |
          set -euo pipefail
          source_compose=(docker compose --project-name "$IOT_COMPOSE_PROJECT" --profile application --env-file "$IOT_ENVIRONMENT_FILE" --env-file artifacts/release/image-digests.env -f deploy/docker-compose.yml -f deploy/docker-compose.immutable.yml)
          backup_path="$("${source_compose[@]}" exec -T backup sh -ec 'ls -1t /backups/*.dump | head -n 1')"
          test -n "$backup_path"
          mkdir -p artifacts/recovery-drill/logical
          backup_name="$(basename "$backup_path")"
          "${source_compose[@]}" cp "backup:$backup_path" "artifacts/recovery-drill/logical/$backup_name"
          "${source_compose[@]}" cp "backup:$backup_path.sha256" "artifacts/recovery-drill/logical/$backup_name.sha256"
          chmod 0644 "artifacts/recovery-drill/logical/$backup_name" "artifacts/recovery-drill/logical/$backup_name.sha256"
          IOT_RESTORE_CONFIRM=RESTORE \
          IOT_RECOVERY_PROJECT="$IOT_LOGICAL_RECOVERY_PROJECT" \
          bash scripts/runtime/recovery-drill.sh "artifacts/recovery-drill/logical/$backup_name" \
            --mode immutable \
            --digest-manifest artifacts/release/image-digests.json \
            --release-services artifacts/release/release-services.json
          node -e "const fs=require('fs'); fs.writeFileSync('artifacts/recovery-drill/logical-recovery.json', JSON.stringify({schemaVersion:1,releaseCandidateId:process.env.IOT_RELEASE_CANDIDATE_ID,sourceSha:process.env.IOT_SOURCE_SHA,manifestSha256:process.env.IOT_IMAGE_MANIFEST_SHA256,status:'PASS'}, null, 2)+'\\n')"
      - name: Run protected immutable WAL-G physical recovery drill
        run: |
          IOT_PITR_CONFIRM=PITR bash scripts/runtime/wal-recovery-drill.sh \
            --mode immutable \
            --digest-manifest artifacts/release/image-digests.json \
            --release-services artifacts/release/release-services.json
      - name: Verify recovery-added service digest evidence
        run: |
          set -euo pipefail
          node -e "const e=require('./artifacts/recovery-drill/logical-recovery.json'); if(e.status !== 'PASS' || e.releaseCandidateId !== process.env.IOT_RELEASE_CANDIDATE_ID || e.sourceSha !== process.env.IOT_SOURCE_SHA || e.manifestSha256 !== process.env.IOT_IMAGE_MANIFEST_SHA256) process.exit(1)"
          evidence="$(find artifacts/recovery-drill -name service-digests.json -print -quit)"
          test -n "$evidence"
          node -e "const e=require('./' + process.argv[1]); if(e.status !== 'PASS' || e.verifiedServiceCount !== 1 || e.expectedServiceCount !== 1) process.exit(1)" "$evidence"
      - name: Write recovery stage handoff result
        id: stage-handoff
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CALLER_REF_RAW: ${{ inputs.caller_workflow_ref_raw }}
          CALLER_WORKFLOW_SHA: ${{ inputs.caller_workflow_sha }}
        run: |
          set -euo pipefail
          caller_path="$(sed -E 's#^[^/]*/[^/]*/(.+)@.*$#\1#' <<< "$CALLER_REF_RAW")"
          bash scripts/ci/write-stage-result.sh \
            --candidate artifacts/release/release-candidate.json \
            --manifest artifacts/release/image-digests.json \
            --stage recovery \
            --checked-out-source-sha "$SOURCE_SHA" \
            --producer-repository "$GITHUB_REPOSITORY" \
            --producer-event "$GITHUB_EVENT_NAME" \
            --invocation-mode orchestrated-reusable \
            --caller-repository "$GITHUB_REPOSITORY" \
            --caller-workflow-ref-raw "$CALLER_REF_RAW" \
            --caller-workflow-sha "$CALLER_WORKFLOW_SHA" \
            --caller-workflow-path "$caller_path" \
            --caller-workflow-identity "$GITHUB_REPOSITORY/$caller_path@$CALLER_WORKFLOW_SHA" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --producer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --producer-workflow-ref-raw "${{ job.workflow_ref || github.workflow_ref }}" \
            --producer-workflow-sha "${{ job.workflow_sha || github.workflow_sha }}" \
            --producer-job immutable-physical-recovery \
            --artifact-name "immutable-recovery-${{ inputs.release_candidate_id }}" \
            --orchestrator-run-id "${{ inputs.orchestrator_run_id }}" \
            --runner-class self-hosted-ephemeral \
            --output artifacts/recovery-drill/stage-recovery.json
          echo "producer_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "producer_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-recovery-${{ inputs.release_candidate_id }}
          path: artifacts/recovery-drill/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove only this release recovery target
        if: ${{ always() }}
        run: |
          set -euo pipefail
          case "$IOT_RECOVERY_PROJECT" in
            iot-manager-release-pitr-*) ;;
            *) echo 'Refusing to remove a non-release recovery project.' >&2; exit 1 ;;
          esac
          export IOT_RECOVERY_TARGET_NAME=cleanup_restore_point
          export IOT_RECOVERY_BASE_BACKUP=base_cleanup_placeholder
          docker compose --project-name "$IOT_RECOVERY_PROJECT" \
            --env-file "$IOT_ENVIRONMENT_FILE" \
            --env-file artifacts/release/image-digests.env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.recovery.yml \
            -f deploy/docker-compose.immutable.yml \
            -f deploy/docker-compose.immutable.recovery.yml \
            down -v --remove-orphans || true
          docker compose --project-name "$IOT_LOGICAL_RECOVERY_PROJECT" \
            --env-file "$IOT_ENVIRONMENT_FILE" \
            --env-file artifacts/release/image-digests.env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.integration.yml \
            -f deploy/docker-compose.immutable.yml \
            down -v --remove-orphans || true
          rm -rf deploy/.runtime deploy/.env.recovery
