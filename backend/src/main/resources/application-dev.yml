spring:
  datasource:
    url: jdbc:h2:file:./data/iotdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    baseline-on-migrate: true

iot:
  command-simulator:
    enabled: true
    interval-ms: 1000
    initial-delay-ms: 5000

  simulator:
    enabled: true
    interval-ms: 4000
    initial-device-count: 12
