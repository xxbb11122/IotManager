server:
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  config:
    # Docker Compose mounts runtime credentials as files. Keeping this import
    # optional preserves explicit non-container startup diagnostics while the
    # production compose path never puts secrets in `docker inspect` output.
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${IOT_DB_URL:jdbc:postgresql://postgres:5432/iot_manager}
    username: ${IOT_DB_USERNAME:iot_manager}
    password: ${IOT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${IOT_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${IOT_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${IOT_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${IOT_DB_VALIDATION_TIMEOUT_MS:3000}
      max-lifetime: ${IOT_DB_MAX_LIFETIME_MS:1800000}
  h2:
    console:
      enabled: false
  flyway:
    baseline-on-migrate: false
    # Do not make a short PostgreSQL or Docker-engine recovery permanently
    # strand Backend during its first Flyway connection. The finite retry
    # window keeps startup bounded while allowing normal dependency ordering
    # and a controlled database restart to converge without operator action.
    connect-retries: ${IOT_FLYWAY_CONNECT_RETRIES:24}
    connect-retries-interval: ${IOT_FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
    # PostgreSQL uses equivalent V2/V5/V6/V8 scripts for syntax and TEXT
    # handling that differ from the long-lived H2 development history.
    locations:
      - classpath:db/migration
      - classpath:db/migration-postgresql
    # Migrations own the schema; the long-lived application role has DML-only
    # grants. In non-Docker production launches the values may still be set
    # as protected environment variables.
    user: ${IOT_FLYWAY_USERNAME:${IOT_DB_USERNAME}}
    password: ${IOT_FLYWAY_PASSWORD:${IOT_DB_PASSWORD}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IOT_SECURITY_ISSUER_URI}
          # Public issuer validation with an internal JWK URL avoids relying on
          # public-DNS hairpinning from the Docker network during boot.
          jwk-set-uri: ${IOT_SECURITY_JWK_SET_URI}

# Docker uses readiness, rather than liveness, to decide whether the backend
# may receive traffic. Include the real database contributor so a PostgreSQL
# outage fails closed instead of leaving an application-process-only probe UP.
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

iot:
  security:
    enabled: true
  edge-agent:
    require-secure-transport: true
  rate-limit:
    enabled: true
    reads-per-minute: ${IOT_RATE_LIMIT_READS_PER_MINUTE:120}
    commands-per-minute: ${IOT_RATE_LIMIT_COMMANDS_PER_MINUTE:30}
  web:
    # Required, comma-separated HTTPS origins supplied by deployment secrets,
    # for example: https://iot.example.com,https://ops.example.com
    allowed-origins: ${IOT_WEB_ALLOWED_ORIGINS}
    require-secure-transport: true
  command-simulator:
    enabled: false
  simulator:
    enabled: false
  weather:
    privacy:
      fingerprint-secret: ${IOT_WEATHER_FINGERPRINT_SECRET}
  observability:
    # Docker Compose mounts this opaque value from a secret file. It only
    # authorizes /actuator/prometheus on the internal Docker network.
    scrape-token: ${IOT_METRICS_SCRAPE_TOKEN:}
  bootstrap:
    # The Keycloak subject is not a secret, but it must be explicitly supplied
    # after the initial OWNER user has been created in the imported realm.
    require-owner: true
    owner-subject: ${IOT_BOOTSTRAP_OWNER_SUBJECT:}
    owner-username: ${IOT_BOOTSTRAP_OWNER_USERNAME:}
    owner-display-name: ${IOT_BOOTSTRAP_OWNER_DISPLAY_NAME:}
    owner-email: ${IOT_BOOTSTRAP_OWNER_EMAIL:}
    # Integration identities are enabled only by the isolated test launcher.
    # Production still maps only its explicit OWNER by default; a deliberately
    # supplied viewer remains supported for controlled onboarding.
    integration-identities-enabled: ${IOT_BOOTSTRAP_INTEGRATION_IDENTITIES_ENABLED:false}
    admin-subject: ${IOT_BOOTSTRAP_ADMIN_SUBJECT:}
    admin-username: ${IOT_BOOTSTRAP_ADMIN_USERNAME:}
    admin-display-name: ${IOT_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    admin-email: ${IOT_BOOTSTRAP_ADMIN_EMAIL:}
    operator-subject: ${IOT_BOOTSTRAP_OPERATOR_SUBJECT:}
    operator-username: ${IOT_BOOTSTRAP_OPERATOR_USERNAME:}
    operator-display-name: ${IOT_BOOTSTRAP_OPERATOR_DISPLAY_NAME:}
    operator-email: ${IOT_BOOTSTRAP_OPERATOR_EMAIL:}
    viewer-subject: ${IOT_BOOTSTRAP_VIEWER_SUBJECT:}
    viewer-username: ${IOT_BOOTSTRAP_VIEWER_USERNAME:}
    viewer-display-name: ${IOT_BOOTSTRAP_VIEWER_DISPLAY_NAME:}
    viewer-email: ${IOT_BOOTSTRAP_VIEWER_EMAIL:}
    organization-code: ${IOT_BOOTSTRAP_ORGANIZATION_CODE:}
    organization-name: ${IOT_BOOTSTRAP_ORGANIZATION_NAME:}
    site-code: ${IOT_BOOTSTRAP_SITE_CODE:}
    site-name: ${IOT_BOOTSTRAP_SITE_NAME:}
    secondary-site-code: ${IOT_BOOTSTRAP_SECONDARY_SITE_CODE:}
    secondary-site-name: ${IOT_BOOTSTRAP_SECONDARY_SITE_NAME:}
    space-path: ${IOT_BOOTSTRAP_SPACE_PATH:/operations}
    space-name: ${IOT_BOOTSTRAP_SPACE_NAME:Operations}
