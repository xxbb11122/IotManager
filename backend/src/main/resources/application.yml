server:
  port: 8080

spring:
  application:
    name: iot-manager

  profiles:
    default: dev

  flyway:
    enabled: true
    # The legacy H2 scripts retain their original checksums. Production swaps
    # only the database-specific versions in application-prod.yml.
    locations:
      - classpath:db/migration
      - classpath:db/migration-h2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      # Keep the endpoint explicitly enabled because the R1 Compose profile
      # performs an authenticated, Docker-internal scrape rather than relying
      # on the framework's endpoint-enable default.
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

iot:
  security:
    # R0 development/test remain open only inside a controlled network. The
    # production profile turns this on and requires Keycloak-issued JWTs.
    enabled: false
  edge-agent:
    require-secure-transport: false
  rate-limit:
    enabled: false
    reads-per-minute: 120
    archive-reads-per-minute: 5
    commands-per-minute: 30
  time:
    clock-skew-tolerance: 30s
    # N-1 wrote server-authored LocalDateTime fields in this deployment zone.
    # Only compatibility columns use it; new decisions use UTC Instants.
    legacy-zone: ${IOT_TIME_LEGACY_ZONE:Asia/Shanghai}
  retention:
    enabled: ${IOT_RETENTION_ENABLED:false}
    dry-run: ${IOT_RETENTION_DRY_RUN:true}
    schedule: ${IOT_RETENTION_SCHEDULE:0 30 2 * * *}
    batch-size: ${IOT_RETENTION_BATCH_SIZE:5000}
    lock-lease: ${IOT_RETENTION_LOCK_LEASE:45m}
    batch-timeout: ${IOT_RETENTION_BATCH_TIMEOUT:2m}
    capacity-sample-ms: ${IOT_RETENTION_CAPACITY_SAMPLE_MS:600000}
    capacity-sample-initial-delay-ms: ${IOT_RETENTION_CAPACITY_SAMPLE_INITIAL_DELAY_MS:60000}
    telemetry-hot: 90d
    telemetry-total: 365d
    audit: 730d
    command: 730d
    alert: 365d
    weather-snapshot: 90d
    weather-forecast: 30d
    credential-rotation: 730d
  web:
    allowed-origins:
      - "*"
  weather:
    privacy:
      # Production overrides this with a deployment secret so persisted cache
      # fingerprints never reveal a site's precise weather coordinates.
      fingerprint-secret: ${IOT_WEATHER_FINGERPRINT_SECRET:local-development-weather-fingerprint-secret}
    environment-rules:
      temperature-ideal-min: 20
      temperature-ideal-max: 25
      temperature-normal-min: 18
      temperature-normal-max: 28
      temperature-risk-high: 35
      humidity-ideal-min: 40
      humidity-ideal-max: 60
      humidity-normal-min: 30
      humidity-normal-max: 70
      humidity-risk-low: 20
      humidity-risk-high: 80
      pressure-ideal-min-kpa: 95
      pressure-ideal-max-kpa: 105
      pressure-normal-min-kpa: 90
      pressure-normal-max-kpa: 110
      pressure-risk-low-kpa: 80
      esd-observe-humidity-pct: 30
      esd-risk-humidity-pct: 20
      condensation-observe-margin-c: 5
      condensation-risk-margin-c: 2
