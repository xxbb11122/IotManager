global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: iot-manager-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    # Prometheus reads the opaque token from a Docker secret file. It never
    # appears in the committed configuration, command line, or image layer.
    http_headers:
      X-Iot-Metrics-Token:
        files:
          - /run/secrets/metrics_scrape_token
