services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN to your public domain, e.g. iot.example.com}
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN to your public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
